<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zing — Investor Overview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #F5F1E8;
  color: #1D2E32;
  font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  overflow: hidden;
  position: relative;
}
/* Subtle decorative leaves */
.leaf {
  position: absolute;
  opacity: 0.06;
  pointer-events: none;
  color: #1D2E32;
}
.leaf.tl { top: -60px; left: -40px; width: 320px; transform: rotate(-20deg); }
.leaf.br { bottom: -80px; right: -60px; width: 380px; transform: rotate(160deg); }

.logo {
  width: 200px;
  margin-bottom: 44px;
  animation: pop .6s cubic-bezier(.2,.7,.25,1) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

h1 {
  font-family: 'Newsreader', serif;
  font-weight: 400;
  font-size: clamp(40px, 6vw, 72px);
  line-height: 1.05;
  letter-spacing: -.015em;
  text-align: center;
  margin: 0;
  max-width: 900px;
  text-wrap: balance;
  animation: rise .65s cubic-bezier(.2,.7,.25,1) both;
  animation-delay: .1s;
}
.sub {
  margin: 24px 0 0;
  font-size: clamp(17px, 1.6vw, 22px);
  color: #647271;
  text-align: center;
  max-width: 640px;
  line-height: 1.5;
  animation: rise .65s cubic-bezier(.2,.7,.25,1) both;
  animation-delay: .22s;
}

.gate {
  margin-top: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: rise .65s cubic-bezier(.2,.7,.25,1) both;
  animation-delay: .34s;
  width: 100%;
  max-width: 440px;
}
.field {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #FBF9F4;
  border: 1px solid #E6DECF;
  border-radius: 999px;
  padding: 6px 8px 6px 26px;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.field:focus-within {
  border-color: #5F7A63;
  box-shadow: 0 0 0 4px rgba(95,122,99,.14);
}
.field.error {
  border-color: #B85C4E;
  box-shadow: 0 0 0 4px rgba(184,92,78,.15);
  animation: shake .35s ease;
}
input[type="password"], input[type="text"] {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  font-family: inherit;
  font-size: 20px;
  color: #1D2E32;
  padding: 14px 0;
  min-width: 0;
  letter-spacing: .01em;
}
input::placeholder { color: #A8AFAB; }
button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  font-size: 17px;
  color: #F5F1E8;
  background: #1D2E32;
  border-radius: 999px;
  padding: 12px 24px;
  transition: background .18s ease, transform .12s ease;
  white-space: nowrap;
}
button:hover { background: #2A4145; }
button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; }

.hint {
  font-size: 14px;
  color: #8A9492;
  min-height: 20px;
  text-align: center;
  animation: fade .4s ease both;
}
.hint.err { color: #B85C4E; }

.footer {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 14px;
  color: #8A9492;
  animation: fade .9s ease both;
  animation-delay: 1s;
}

@media (max-width: 560px) {
  .logo { width: 160px; margin-bottom: 32px; }
  .gate { margin-top: 36px; }
  button { padding: 12px 20px; font-size: 16px; }
  input { font-size: 18px; }
  .field { padding: 4px 6px 4px 22px; }
}
</style>
</head>
<body>

<svg class="leaf tl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path fill="currentColor" d="M50 5 C 75 20, 90 45, 85 70 C 82 85, 65 95, 50 95 C 35 95, 18 85, 15 70 C 10 45, 25 20, 50 5 Z M50 15 L50 90"/>
</svg>
<svg class="leaf br" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path fill="currentColor" d="M50 5 C 75 20, 90 45, 85 70 C 82 85, 65 95, 50 95 C 35 95, 18 85, 15 70 C 10 45, 25 20, 50 5 Z M50 15 L50 90"/>
</svg>

<img class="logo" src="templates/investor-deck/img/zing-logo.svg" alt="Zing">

<h1>An extra set of hands,<br>right down the hall.</h1>
<p class="sub">Investor overview · Summer 2026 · Private</p>

<form class="gate" id="gateForm" autocomplete="off">
  <div class="field" id="field">
    <input
      type="password"
      id="pw"
      placeholder="Passcode"
      aria-label="Passcode"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      required
    >
    <button type="submit" id="submitBtn">Enter →</button>
  </div>
  <div class="hint" id="hint">Enter the passcode Alvaro shared to view the deck.</div>
</form>

<div class="footer">Zing · Neighborhood Studios</div>

<script>
  (function () {
    var STORAGE_KEY = 'zing_investor_unlocked';
    var PASSWORD = 'justzingit';
    var DECK_URL = 'templates/investor-deck/InvestorDeck.dc.html';

    // If already unlocked, go straight to the deck.
    try {
      if (localStorage.getItem(STORAGE_KEY) === '1') {
        window.location.replace(DECK_URL);
        return;
      }
    } catch (e) {}

    var form = document.getElementById('gateForm');
    var input = document.getElementById('pw');
    var field = document.getElementById('field');
    var hint = document.getElementById('hint');
    var btn = document.getElementById('submitBtn');

    input.focus();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var val = (input.value || '').trim().toLowerCase();
      if (val === PASSWORD) {
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        btn.disabled = true;
        btn.textContent = 'Opening…';
        hint.classList.remove('err');
        hint.textContent = 'Welcome — loading the deck.';
        setTimeout(function () { window.location.assign(DECK_URL); }, 350);
      } else {
        field.classList.remove('error');
        // reflow to restart the shake animation
        void field.offsetWidth;
        field.classList.add('error');
        hint.classList.add('err');
        hint.textContent = 'That passcode didn\u2019t work. Try again — or ask Alvaro.';
        input.select();
      }
    });

    input.addEventListener('input', function () {
      if (field.classList.contains('error')) {
        field.classList.remove('error');
        hint.classList.remove('err');
        hint.textContent = 'Enter the passcode Alvaro shared to view the deck.';
      }
    });
  })();
</script>

</body>
</html>
